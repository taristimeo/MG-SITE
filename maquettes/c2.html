<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mauvais Grain — Le Viseur</title>
<link rel="stylesheet" href="_base.css">
<style>
/* ═══ LE VISEUR ═══════════════════════════════════════════════ */

body { background:#070605; }

.viewer{
  position:fixed; inset:0; overflow:hidden;
  background:var(--ink);
  -webkit-user-select:none; user-select:none;
}
::selection{ background:rgba(183,110,78,.35); color:var(--bone); }

/* ── Les plans ─────────────────────────────────────────────── */
.frames{
  position:absolute; inset:-4%;
  transition:filter .55s var(--soft);
  will-change:filter;
}
.frame{
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  opacity:0;
  will-change:opacity,transform;
}

/* Vignettage + scrims de lisibilité */
.vig{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 92% at 50% 44%, rgba(7,6,5,0) 34%, rgba(7,6,5,.42) 74%, rgba(7,6,5,.82) 100%);
}
.scrim-b{
  position:absolute; left:0; right:0; bottom:0; height:78%; pointer-events:none;
  background:linear-gradient(to top,
    rgba(7,6,5,.97) 0%, rgba(7,6,5,.93) 18%, rgba(7,6,5,.78) 38%,
    rgba(7,6,5,.44) 60%, rgba(7,6,5,0) 100%);
}
.scrim-t{
  position:absolute; left:0; right:0; top:0; height:26%; pointer-events:none;
  background:linear-gradient(to bottom, rgba(7,6,5,.72), rgba(7,6,5,0));
}
.scrim-l{
  position:absolute; left:0; top:0; bottom:0; width:44%; pointer-events:none;
  background:linear-gradient(to right, rgba(7,6,5,.66), rgba(7,6,5,0));
}

/* ── HUD : coins de cadrage ────────────────────────────────── */
.corner{ position:absolute; width:30px; height:30px; pointer-events:none;
  border:0 solid rgba(236,232,220,.42); }
.corner.tl{ top:26px; left:26px; border-top-width:1px; border-left-width:1px; }
.corner.tr{ top:26px; right:26px; border-top-width:1px; border-right-width:1px; }
.corner.bl{ bottom:26px; left:26px; border-bottom-width:1px; border-left-width:1px; }
.corner.br{ bottom:26px; right:26px; border-bottom-width:1px; border-right-width:1px; }

/* mires de centre */
.crosshair{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:44px; height:44px; pointer-events:none; opacity:.5; }
.crosshair i{ position:absolute; background:rgba(236,232,220,.5); }
.crosshair i:nth-child(1){ left:0; top:50%; width:13px; height:1px; }
.crosshair i:nth-child(2){ right:0; top:50%; width:13px; height:1px; }
.crosshair i:nth-child(3){ top:0; left:50%; height:13px; width:1px; }
.crosshair i:nth-child(4){ bottom:0; left:50%; height:13px; width:1px; }

/* ── Barre haute ───────────────────────────────────────────── */
.top{
  position:absolute; top:46px; left:64px; right:64px;
  display:flex; align-items:flex-start; justify-content:space-between;
}
.logo{ font-family:var(--wide); font-size:21px; letter-spacing:-.01em; color:var(--bone);
  text-shadow:0 1px 22px rgba(7,6,5,.9); }
.logo .dot{ color:var(--terra); }
.top-r{ display:flex; align-items:center; gap:26px; }
.rec{ display:flex; align-items:center; gap:9px; }
.rec-dot{ width:7px; height:7px; border-radius:50%; background:var(--terra);
  animation:pulse 1.9s var(--soft) infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(183,110,78,.5);}
  50%{ opacity:.35; box-shadow:0 0 0 6px rgba(183,110,78,0);} }
.rec span{ font-family:var(--cond); font-size:9.5px; letter-spacing:.22em; color:var(--bone); }
.tc{ font-family:var(--cond); font-size:11px; letter-spacing:.1em;
  color:rgba(236,232,220,.82); font-variant-numeric:tabular-nums; }
.lens{ font-family:var(--cond); font-size:9.5px; letter-spacing:.18em;
  color:rgba(236,232,220,.5); }

/* ── Bloc titre ────────────────────────────────────────────── */
.plate{
  position:absolute; left:64px; bottom:262px; width:660px;
}
.marks{
  font-family:var(--cond); font-size:9.5px; letter-spacing:.2em;
  color:rgba(236,232,220,.6); display:flex; align-items:center; gap:12px;
  margin-bottom:20px; height:12px;
  transition:opacity .4s var(--soft);
}
.marks b{ font-weight:500; color:var(--terra); }
.marks em{ font-style:normal; width:14px; height:1px; background:rgba(236,232,220,.28); display:block; }

.titles{ position:relative; height:172px; overflow:visible; }
.ttl{
  position:absolute; left:0; bottom:0; width:660px;
  font-family:var(--wide); font-weight:400; font-size:74px; line-height:.94;
  letter-spacing:-.015em; color:var(--bone); opacity:0;
  text-shadow:0 2px 40px rgba(7,6,5,.85);
  will-change:opacity,transform,filter;
}
.approach{
  margin-top:22px; max-width:452px;
  font-family:var(--sans); font-weight:300; font-size:15.5px; line-height:1.66;
  color:rgba(236,232,220,.7);
  transition:opacity .5s var(--soft), transform .5s var(--soft);
}
.approach::before{
  content:""; display:block; width:26px; height:1px;
  background:var(--terra); margin-bottom:16px;
}

/* ── Panneau d'information (état 2) ────────────────────────── */
.panel{
  position:absolute; right:64px; top:50%; width:344px;
  transform:translate(26px,-56%); opacity:0; pointer-events:none;
  transition:opacity .6s var(--soft), transform .7s var(--expo);
  background:rgba(10,9,8,.52);
  -webkit-backdrop-filter:blur(16px) saturate(.9);
  backdrop-filter:blur(16px) saturate(.9);
  border:1px solid rgba(236,232,220,.13);
  padding:30px 32px 32px;
}
.panel-h{
  font-family:var(--cond); font-size:9.5px; letter-spacing:.2em;
  color:var(--bone-faint); padding-bottom:18px;
  border-bottom:1px solid rgba(236,232,220,.12);
  display:flex; justify-content:space-between;
}
.row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:15px 0; border-bottom:1px solid rgba(236,232,220,.08);
}
.row dt{ font-family:var(--cond); font-size:9.5px; letter-spacing:.18em;
  color:var(--bone-faint); }
.row dd{ margin:0; font-family:var(--sans); font-weight:400; font-size:14.5px;
  color:var(--bone); letter-spacing:.005em; }
.panel-a{
  margin:22px 0 26px; font-family:var(--sans); font-weight:300;
  font-size:14px; line-height:1.68; color:rgba(236,232,220,.72);
}
.panel-a i{ display:block; font-style:normal; font-family:var(--cond);
  font-size:9.5px; letter-spacing:.2em; color:var(--terra); margin-bottom:11px; }
.btn{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; padding:14px 18px; background:transparent;
  border:1px solid rgba(183,110,78,.55); color:var(--bone);
  font-family:var(--cond); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  cursor:pointer; transition:background .35s var(--soft), border-color .35s var(--soft);
}
.btn:hover{ background:rgba(183,110,78,.16); border-color:var(--terra); }
.btn u{ text-decoration:none; color:var(--terra); font-size:13px; }

/* ── LA BAGUE ──────────────────────────────────────────────── */
.ring-stage{
  position:absolute; left:0; right:0; bottom:0; height:214px;
  perspective:1100px; perspective-origin:50% -14%;
  cursor:grab; touch-action:none;
}
.ring-stage:active{ cursor:grabbing; }
.ring-stage::before{  /* assise sombre de la bague */
  content:""; position:absolute; left:0; right:0; bottom:0; height:100%;
  background:linear-gradient(to top, rgba(7,6,5,.92), rgba(7,6,5,.55) 46%, rgba(7,6,5,0));
  pointer-events:none;
}
.arcs{ position:absolute; left:50%; bottom:0; width:1760px; height:214px;
  transform:translateX(-50%); pointer-events:none; overflow:visible; }

.ring{
  position:absolute; left:0; right:0; top:0; height:100%;
  transform-style:preserve-3d; transform:rotateX(8deg);
  will-change:transform;
}
.tick{
  position:absolute; left:50%; top:58px; width:1px;
  background:rgba(236,232,220,.34); transform-origin:50% 50%;
}
.tick.maj{ background:rgba(236,232,220,.62); }
.lbl{
  position:absolute; left:50%; top:96px; width:250px; margin-left:-125px;
  text-align:center; font-family:var(--cond); font-weight:500;
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--bone); white-space:nowrap;
  transform-origin:50% 50%; will-change:transform,opacity,filter;
}
.lbl .n{ display:block; font-size:8.5px; letter-spacing:.2em; margin-top:7px;
  color:var(--bone-faint); }

/* index central */
.index{
  position:absolute; left:50%; bottom:34px; width:1px; height:132px;
  transform:translateX(-.5px); pointer-events:none;
  background:linear-gradient(to top, rgba(183,110,78,0) 8%, rgba(183,110,78,.42) 30%,
    rgba(183,110,78,.8) 66%, rgba(183,110,78,0) 100%);
}
.index::before{
  content:""; position:absolute; left:50%; top:0px; transform:translateX(-50%);
  width:0; height:0; border-left:4.5px solid transparent; border-right:4.5px solid transparent;
  border-top:6px solid var(--terra);
}
.glowc{
  position:absolute; left:50%; bottom:-40px; width:520px; height:190px;
  transform:translateX(-50%); pointer-events:none;
  background:radial-gradient(50% 60% at 50% 50%, rgba(183,110,78,.18), rgba(183,110,78,0) 70%);
  opacity:0; transition:opacity .6s var(--soft);
}

/* ── Indication du geste ───────────────────────────────────── */
.hint{
  position:absolute; left:50%; bottom:240px; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px;
  font-family:var(--cond); font-size:9.5px; letter-spacing:.24em;
  color:rgba(236,232,220,.62); white-space:nowrap;
  transition:opacity .7s var(--soft), transform .7s var(--soft);
}
.hint s{ text-decoration:none; color:var(--terra); font-size:12px; display:block;
  animation:sway 2.6s var(--soft) infinite; }
.hint s:last-of-type{ animation-direction:reverse; }
@keyframes sway{ 0%,100%{ transform:translateX(-2px); opacity:.45; }
  50%{ transform:translateX(2px); opacity:1; } }

/* ── Pied ──────────────────────────────────────────────────── */
.foot{
  position:absolute; left:64px; bottom:26px;
  font-family:var(--cond); font-size:9px; letter-spacing:.2em;
  color:var(--bone-faint); z-index:6;
}
.foot-r{
  position:absolute; right:64px; bottom:26px;
  font-family:var(--cond); font-size:9px; letter-spacing:.2em;
  color:var(--bone-faint); z-index:6;
}

/* ── États ─────────────────────────────────────────────────── */
[data-st="1"] .hint{ opacity:1; }
[data-st="1"] .marks{ opacity:.28; }
[data-st="1"] .approach{ opacity:.1; }
[data-st="2"] .hint{ opacity:0; transform:translateX(-50%) translateY(8px); }
[data-st="1"] .ttl{ text-shadow:0 2px 46px rgba(7,6,5,.95); }
[data-st="2"] .panel{ opacity:1; transform:translate(0,-50%); pointer-events:auto; }
[data-st="2"] .approach{ opacity:0; transform:translateY(6px); }
[data-st="2"] .glowc{ opacity:1; }
[data-st="2"] .plate{ width:600px; }
.hint.gone{ opacity:0; }

/* ── Mobile ────────────────────────────────────────────────── */
@media (max-width:520px){
  .top{ top:26px; left:22px; right:22px; }
  .logo{ font-size:17px; }
  .lens{ display:none; }
  .top-r{ gap:14px; }
  .corner{ width:20px; height:20px; }
  .corner.tl,.corner.tr{ top:14px; } .corner.bl,.corner.br{ bottom:14px; }
  .corner.tl,.corner.bl{ left:14px; } .corner.tr,.corner.br{ right:14px; }
  .crosshair{ display:none; }
  .plate{ left:22px; right:22px; width:auto; bottom:222px; }
  .ttl{ font-size:38px; width:auto; right:0; }
  .titles{ height:96px; }
  .approach{ font-size:13.5px; margin-top:16px; max-width:none; }
  .marks{ font-size:8.5px; letter-spacing:.16em; gap:8px; margin-bottom:14px; }
  .ring-stage{ height:170px; }
  .arcs{ width:900px; height:170px; }
  .ring{ height:100%; }
  .tick{ top:44px; } .lbl{ top:76px; font-size:9px; letter-spacing:.1em; }
  .index{ height:100px; bottom:26px; }
  .hint{ bottom:172px; font-size:8.5px; letter-spacing:.18em; }
  .panel{ right:22px; left:22px; width:auto; top:auto; bottom:196px;
    transform:translateY(20px); padding:20px 22px 22px; }
  [data-st="2"] .panel{ transform:translateY(0); }
  [data-st="2"] .plate{ width:auto; }
  [data-st="2"] .plate{ opacity:0; }
  .panel-a{ margin:14px 0 18px; font-size:13px; }
  .foot{ display:none; } .foot-r{ display:none; }
}
</style>
</head>
<body data-tone="dark" data-st="0">

<div class="viewer" id="viewer">

  <div class="frames" id="frames"></div>
  <div class="vig"></div>
  <div class="scrim-t"></div>
  <div class="scrim-l"></div>
  <div class="scrim-b"></div>

  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="crosshair"><i></i><i></i><i></i><i></i></div>

  <div class="top">
    <div class="logo">Mauvais Grain<span class="dot">.</span></div>
    <div class="top-r">
      <div class="lens">VISEUR — 24 IPS</div>
      <div class="tc" id="tc">00:00:00:00</div>
      <div class="rec"><div class="rec-dot"></div><span>REC</span></div>
    </div>
  </div>

  <div class="plate">
    <div class="marks" id="marks"></div>
    <div class="titles" id="titles"></div>
    <p class="approach" id="approach"></p>
  </div>

  <div class="panel" id="panel">
    <div class="panel-h"><span>FICHE DU PLAN</span><span id="pn">03 / 06</span></div>
    <dl style="margin:0">
      <div class="row"><dt>CLIENT</dt><dd id="p-cl"></dd></div>
      <div class="row"><dt>ANNÉE</dt><dd id="p-yr"></dd></div>
      <div class="row"><dt>CATÉGORIE</dt><dd id="p-ct"></dd></div>
    </dl>
    <p class="panel-a"><i>APPROCHE</i><span id="p-ap"></span></p>
    <button class="btn">Voir le film <u>→</u></button>
  </div>

  <div class="glowc"></div>

  <div class="hint" id="hint"><s>‹</s> Tournez la bague <s>›</s></div>

  <div class="ring-stage" id="stage">
    <svg class="arcs" viewBox="0 0 1760 214" preserveAspectRatio="none">
      <path d="M0 48 Q880 96 1760 48" fill="none" stroke="rgba(236,232,220,.16)" stroke-width="1"/>
      <path d="M0 96 Q880 146 1760 96" fill="none" stroke="rgba(236,232,220,.10)" stroke-width="1"/>
      <path d="M0 152 Q880 200 1760 152" fill="none" stroke="rgba(236,232,220,.07)" stroke-width="1"/>
    </svg>
    <div class="ring" id="ring"></div>
    <div class="index"></div>
  </div>

  <div class="foot">L'IMAGE AU SERVICE DE VOTRE HISTOIRE.</div>
  <div class="foot-r">BORDEAUX — DEPUIS 2022</div>

  <div class="grain"></div>
</div>

<script>
(function(){
"use strict";

var FILMS = [
 { t:"The Sound of Discovery", cl:"Autoproduit", ct:"Tourisme", yr:"2026",
   img:"img/the-sound-of-discovery-1.jpg",
   ap:"Observer sans intervenir. Laisser les rencontres, les ambiances et la lumière naturelle guider le récit." },
 { t:"Silhouette", cl:"Autoproduit", ct:"Clip", yr:"2026",
   img:"img/silhouette-1.jpg",
   ap:"Construire le film autour de plans fixes. Le mouvement naît uniquement de la danseuse." },
 { t:"The Shape of Vastness", cl:"Autoproduit", ct:"Tourisme", yr:"2025",
   img:"img/the-shape-of-vastness-1.jpg",
   ap:"Prendre le temps d'observer. Un film contemplatif où chaque plan laisse respirer le paysage." },
 { t:"Gone Colors", cl:"DeLaurentis", ct:"Clip", yr:"2024",
   img:"img/delaurentis-gone-colors-1.jpg",
   ap:"Tourner durant les dernières minutes du jour, pour une lumière douce et chaleureuse." },
 { t:"Graduation", cl:"COB", ct:"Événementiel", yr:"2024",
   img:"img/graduation-1.jpg",
   ap:"Une approche immersive, au plus près des étudiants, pour saisir les instants spontanés." },
 { t:"La Médocaine", cl:"La Médocaine", ct:"Événementiel", yr:"2024",
   img:"img/la-medocaine-1.jpg",
   ap:"Se mêler au public : concerts, DJ, jeux de lumière et feu d'artifice." }
];

var N = FILMS.length;
var R = 660;            // rayon de la bague
var STEP = 30;          // degrés entre deux films
var SUB = 10;           // graduations fines par intervalle
var D2R = Math.PI/180;

var framesEl = document.getElementById('frames');
var titlesEl = document.getElementById('titles');
var ringEl   = document.getElementById('ring');
var body     = document.body;

/* — construction — */
var frames=[], titles=[], labels=[], ticks=[];
FILMS.forEach(function(f,i){
  var d=document.createElement('div');
  d.className='frame';
  d.style.backgroundImage='url("'+f.img+'")';
  framesEl.appendChild(d); frames.push(d);

  var t=document.createElement('h1');
  t.className='ttl wide'; t.textContent=f.t;
  titlesEl.appendChild(t); titles.push(t);

  var l=document.createElement('div');
  l.className='lbl';
  l.innerHTML=f.t+'<span class="n">'+String(i+1).padStart(2,'0')+' — '+f.yr+'</span>';
  ringEl.appendChild(l); labels.push(l);
});

/* graduations */
for(var k=0; k<N*SUB; k++){
  var maj = (k%SUB===0);
  var tk=document.createElement('div');
  tk.className='tick'+(maj?' maj':'');
  tk.style.height=(maj?19:9)+'px';
  ringEl.appendChild(tk);
  ticks.push({ el:tk, pos:k/SUB, maj:maj });
}

/* — état — */
var pos = 0, target = 0, vel = 0, dragging=false, forced=0, interacted=false;

function wrap(d){ d = d % N; if(d > N/2) d -= N; if(d < -N/2) d += N; return d; }
function nearest(){ var r = Math.round(pos) % N; return (r + N) % N; }

function place(el, theta, extra){
  el.style.transform = 'translateZ(-'+R+'px) rotateY('+theta+'deg) translateZ('+R+'px)'+(extra||'');
}

function render(){
  var blur = Math.min(9, Math.abs(vel)*110 + forced*7);

  /* fondu propre : deux plans seulement, composés dans l'ordre du DOM */
  var base = ((Math.floor(pos) % N) + N) % N;
  var nxt  = (base + 1) % N;
  var f    = pos - Math.floor(pos);
  var opA  = {};
  if(f < 0.0005){ opA[base] = 1; }
  else if(nxt > base){ opA[base] = 1; opA[nxt] = f; }
  else { opA[nxt] = 1; opA[base] = 1 - f; }

  for(var i=0;i<N;i++){
    var d = wrap(i - pos), ad = Math.abs(d);
    frames[i].style.opacity = opA[i] || 0;
    frames[i].style.transform = 'translateX('+(-d*54)+'px) scale('+(1.04+Math.min(ad,1)*0.03)+')';

    var to = ad>=1 ? 0 : (ad<0.5 ? 1-ad*0.82 : Math.pow(1-ad, 2.0));
    titles[i].style.opacity = to;
    titles[i].style.transform = 'translate3d('+(-d*46)+'px,'+(d*78)+'px,0)';
    titles[i].style.filter = ad>0.02 ? 'blur('+(ad*6.5).toFixed(2)+'px)' : 'none';
  }
  framesEl.style.filter = blur>0.4 ? 'blur('+blur.toFixed(2)+'px) saturate(.92)' : 'none';

  for(var j=0;j<N;j++){
    var dd = wrap(j - pos), aj = Math.abs(dd);
    var th = dd*STEP;
    var vis = Math.abs(th) > 82 ? 0 : 1;
    var o = aj<0.5 ? 1 : Math.max(0.12, 0.60 - (aj-0.5)*0.26);
    labels[j].style.opacity = vis * o;
    labels[j].style.color = aj<0.5 ? 'var(--terra)' : 'rgba(236,232,220,.9)';
    var lb = (aj<0.5? 0 : Math.min(2.0,(aj-0.5)*0.85)) + blur*0.14;
    labels[j].style.filter = lb>0.3 ? 'blur('+lb.toFixed(2)+'px)' : 'none';
    place(labels[j], th, ' scale('+(aj<0.5?1.06:1)+')');
  }

  for(var m=0;m<ticks.length;m++){
    var tp = ticks[m], td = wrap(tp.pos - pos), at = Math.abs(td);
    var ang = td*STEP;
    if(Math.abs(ang)>88){ tp.el.style.opacity=0; continue; }
    tp.el.style.opacity = at<0.04 ? 1 : Math.max(0.1, 0.85 - at*0.30);
    tp.el.style.background = at<0.05 ? 'var(--terra)' : (tp.maj?'rgba(236,232,220,.62)':'rgba(236,232,220,.3)');
    place(tp.el, ang);
  }

  var n = nearest(), f = FILMS[n];
  document.getElementById('marks').innerHTML =
    '<b>'+f.ct.toUpperCase()+'</b><em></em>'+f.cl.toUpperCase()+'<em></em>'+f.yr;
  document.getElementById('approach').textContent = f.ap;
  document.getElementById('p-cl').textContent = f.cl;
  document.getElementById('p-yr').textContent = f.yr;
  document.getElementById('p-ct').textContent = f.ct;
  document.getElementById('p-ap').textContent = f.ap;
  document.getElementById('pn').textContent = String(n+1).padStart(2,'0')+' / 0'+N;
}

/* — boucle de rappel (snap) — */
var last = pos;
function loop(){
  if(!dragging){
    var diff = target - pos;
    if(Math.abs(diff) > 0.0004){ pos += diff*0.12; }
    else if(pos!==target){ pos = target; }
  }
  vel = pos - last; last = pos;
  if(Math.abs(vel)>0.0006) forced = 0;
  render();
  requestAnimationFrame(loop);
}

/* — commandes — */
var stage = document.getElementById('stage');
function used(){
  if(interacted) return;
  interacted = true;
  document.getElementById('hint').classList.add('gone');
}
function clamp(v){ return v; }

var wheelT;
window.addEventListener('wheel', function(e){
  e.preventDefault(); used(); forced = 0;
  var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  pos = clamp(pos + dx*0.0022);
  target = pos;
  body.dataset.st = '1';
  clearTimeout(wheelT);
  wheelT = setTimeout(function(){ target = clamp(Math.round(pos)); body.dataset.st='0'; }, 150);
}, {passive:false});

var sx=0, sp=0;
function down(x){ dragging=true; sx=x; sp=pos; used(); forced=0; body.dataset.st='1'; }
function move(x){ if(!dragging) return; pos = clamp(sp - (x-sx)/210); target=pos; }
function up(){ if(!dragging) return; dragging=false; target = clamp(Math.round(pos)); body.dataset.st='0'; }

stage.addEventListener('pointerdown', function(e){ e.preventDefault(); down(e.clientX); stage.setPointerCapture(e.pointerId); });
window.addEventListener('pointermove', function(e){ move(e.clientX); });
window.addEventListener('pointerup', up);
window.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'){ used(); target=clamp(Math.round(target)+1); }
  if(e.key==='ArrowLeft'){ used(); target=clamp(Math.round(target)-1); }
});
labels.forEach(function(l,i){
  l.style.cursor='pointer';
  l.addEventListener('click', function(){ used(); target=i; });
});

/* — timecode — */
var tcEl = document.getElementById('tc'), t0 = 0;
function pad(v){ return String(v).padStart(2,'0'); }
setInterval(function(){
  t0 += 1;
  var fr = t0 % 24, s = Math.floor(t0/24)%60, m = Math.floor(t0/1440)%60;
  tcEl.textContent = '00:'+pad(m)+':'+pad(s+17)+':'+pad(fr);
}, 42);

/* — API de capture — */
window.mgState = function(n){
  n = Number(n)||0;
  if(n===1){
    pos = 1.62; target = 1.62; vel = 0; forced = 1;
    body.dataset.st = '1';
    document.getElementById('hint').classList.remove('gone');
  } else if(n===2){
    pos = 2; target = 2; vel = 0; forced = 0;
    body.dataset.st = '2';
  } else {
    pos = 0; target = 0; vel = 0; forced = 0;
    body.dataset.st = '0';
    document.getElementById('hint').classList.remove('gone');
  }
  last = pos;
  render();
  return n;
};

render();
requestAnimationFrame(loop);
})();
</script>
